name: CI

# Roda em PR para develop/main e em push nas branches de trabalho.
# O fluxo do projeto é GitFlow: nada entra em develop sem passar por aqui.
on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, develop]

# Um push novo na mesma branch cancela a execução anterior: não adianta
# gastar runner validando um commit que já foi substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes, tipos e build
    runs-on: ubuntu-latest

    env:
      # O Prisma exige DATABASE_URL até para gerar o client. Aqui é um banco
      # descartável do runner — nenhum dado real passa pelo CI.
      DATABASE_URL: 'file:./ci.db'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` em vez de `npm install`: instala exatamente o lockfile e
      # falha se ele estiver dessincronizado do package.json.
      - name: Instalar dependências
        run: npm ci

      # Formatação é tão mecânica quanto tipo: quem esquecer de rodar o
      # `npm run format` descobre aqui, no PR, e não num review -- e sem o
      # arquivo de config ninguém consegue acertar o estilo sem querer (#47).
      - name: Formatação
        run: npm run format:check

      # Precisa vir antes do typecheck: os tipos do banco vêm do client gerado.
      - name: Gerar Prisma Client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build

      # O agente local não é compilado, então um erro de sintaxe nele só
      # apareceria em produção. Este check é barato e cobre isso.
      - name: Validar sintaxe do agente local
        run: node --check companion/inhouse-companion.mjs

  seguranca:
    name: Segredos e dependências
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O repositório é público: uma chave da Riot commitada por engano fica
      # exposta. Este passo falha o build antes de o merge acontecer.
      - name: Procurar chave da Riot no código
        run: |
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.git \
               -E 'RGAPI-[A-Za-z0-9-]{8,}' .; then
            echo "::error::Chave da Riot encontrada no código. Remova antes de commitar."
            exit 1
          fi
          echo "Nenhuma chave RGAPI encontrada."

      - name: Conferir que .env não está versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env está versionado. Ele guarda segredos."
            exit 1
          fi
          echo ".env não está versionado."

      # Só quebra em vulnerabilidade alta/crítica. Aviso de dependência
      # transitiva de dev não deve travar o merge de um app de amigos.
      - name: Auditoria de dependências
        run: npm audit --audit-level=high
        continue-on-error: true

  # Abre as telas num navegador de verdade e mede o que typecheck, teste e
  # build não enxergam: rolagem lateral e contraste depois de compor opacidade
  # e fundo. Três bugs passaram pelos outros jobs sem aviso (issue #44).
  #
  # Nasce FORA dos checks obrigatórios da proteção de branch: a primeira
  # versão de uma verificação de navegador pode ter falso positivo, e ela não
  # deve travar merge de ninguém enquanto não provar que é estável.
  telas:
    name: Telas no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Banco descartável: com --preparar o script GRAVA uma série de teste, e
    # nada disso pode encostar em dado real.
    env:
      DATABASE_URL: 'file:./ci.db'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Criar banco descartável e semear
        run: |
          npx prisma db push --schema=server/prisma/schema.prisma --skip-generate
          npm run db:seed

      # O servidor serve o front buildado no mesmo endereço da API
      # (montarFrontend em app.ts): mesma origem, sem proxy e sem CORS --
      # igual produção.
      - name: Build do front
        run: npm run build --workspace client

      - name: Instalar Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Subir o servidor
        run: |
          cd server
          nohup npx tsx src/index.ts > ../servidor.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3333/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::o servidor não respondeu em 30s"
          cat ../servidor.log
          exit 1

      # Percorre pela API o caminho inteiro de uma noite de jogos: cadastro na
      # hora, sorteio, sala de draft, MD3 com Fearless, importação do LCU. Vem
      # antes das telas porque as duas etapas gravam no mesmo banco descartável.
      - name: Ensaio da noite
        run: node client/e2e/ensaio-da-noite.mjs --base http://localhost:3333

      - name: Verificar as telas
        run: node client/e2e/verificar-telas.mjs --base http://localhost:3333 --preparar --saida e2e-saida

      # Os screenshots de todas as combinações, para ver o que o script viu.
      - name: Guardar screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: telas
          path: |
            e2e-saida
            servidor.log
          retention-days: 7
